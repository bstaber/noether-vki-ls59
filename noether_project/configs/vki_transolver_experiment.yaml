# @package _global_

dataset_kind: noether_project.datasets.vki_ls59.DatasetVKI

defaults:
  - tracker: disabled
  - _self_

name: vki_upt_conditioned
output_path: ./outputs

model:
  kind: noether_project.models.ConditionedTransolver
  name: vki_transolver_conditioned
  hidden_dim: 128
  position_dim: 2
  output_dim: 2
  depth: 12
  transformer_block_config:
    mlp_expansion_factor: 4
    num_heads: 4
    condition_dim: 2
  attention_arguments:
    num_slices: 32
  optimizer_config:
    kind: torch.optim.AdamW
    lr: 1.0e-4
    weight_decay: 1e-8
    clip_grad_norm: 1.0
    schedule_config:
      kind: noether.core.schedules.LinearWarmupCosineDecaySchedule
      warmup_percent: 0.05
      end_value: 1.0e-6
      max_value: 1.0e-4

trainer:
  kind: noether_project.trainer.TransolverTrainer
  precision: bfloat16
  max_epochs: 100
  effective_batch_size: 1
  log_every_n_updates: 10
  add_default_callbacks: true
  add_trainer_callbacks: false
  callbacks: []
  forward_properties:
    - geometry_position
    - in_scalars
  target_properties:
    - target_mach

datasets:
  train:
    kind: ${dataset_kind}
    dataset_folder: /home/brian/data/physarena/VKI-LS59
    num_samples: 671
    num_supernodes: 2048
    supernode_sampling: uniform_random
    supernode_seed: 1234
    split: train
    dataset_normalizers:
      # nodes:
      #   kind: noether.data.preprocessors.normalizers.FieldNormalizer
      #   strategy: mean_std
      mach:
        kind: noether.data.preprocessors.normalizers.FieldNormalizer
        strategy: mean_std
      in_scalars:
        kind: noether.data.preprocessors.normalizers.FieldNormalizer
        strategy: mean_std

  test:
    kind: ${dataset_kind}
    dataset_folder: /home/brian/data/physarena/VKI-LS59
    num_samples: 168
    num_supernodes: 2048
    supernode_sampling: uniform_random
    supernode_seed: 1234
    split: test
    dataset_normalizers:
      # nodes:
      #   kind: noether.data.preprocessors.normalizers.FieldNormalizer
      #   strategy: mean_std
      mach:
        kind: noether.data.preprocessors.normalizers.FieldNormalizer
        strategy: mean_std
      in_scalars:
        kind: noether.data.preprocessors.normalizers.FieldNormalizer
        strategy: mean_std